<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3D2B1F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="消防設備法規">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta name="description" content="消防設備法規 — 各類場所消防安全設備設置標準與 108 年版消防法令彙編">
  <title>消防設備法規</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <button type="button" class="back-btn" id="backBtn" hidden aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand">
        <img src="assets/logo.png" alt="" class="brand-logo" width="36" height="36">
        <div class="brand-text">
          <h1 class="brand-title" id="pageTitle">消防設備法規</h1>
          <p class="brand-sub" id="pageSub">各類場所消防安全設備設置標準</p>
        </div>
      </div>
      <a class="moj-link" id="headerMojLink" href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0120029" target="_blank" rel="noopener" aria-label="全國法規資料庫">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
    <div class="header-search">
      <label class="search-wrap" for="siteSearch">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input type="search" id="siteSearch" class="search-input" placeholder="搜尋法條、關鍵字…" autocomplete="off" enterkeyhint="search" aria-controls="searchPanel" aria-expanded="false">
      </label>
    </div>
    <div class="header-rule"></div>
  </header>

  <div class="search-panel" id="searchPanel" hidden>
    <ul class="search-results" id="searchResults" role="listbox" aria-label="搜尋結果"></ul>
    <p class="search-empty" id="searchEmpty" hidden>找不到符合的結果</p>
  </div>

  <main class="main" id="app"></main>

  <footer class="site-footer">
    <div class="footer-rule"></div>
    <p class="footer-meta">系統更新：<span id="sysDate"></span>　更新人員：<span id="sysAuthor"></span></p>
    <p class="footer-meta">法規修正日期：<span id="lawDate"></span></p>
    <p class="footer-note" id="footerNote">法條內容連結至 <a href="https://law.moj.gov.tw/" target="_blank" rel="noopener">全國法規資料庫</a>，以司法院最新公布為準。</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/calculators.js"></script>
  <script src="js/fire-code-compilation.js"></script>
  <script src="js/compilation-app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
